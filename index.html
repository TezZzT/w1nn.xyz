<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W1_n</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --panel:rgba(15,8,8,.65);
  --panel-border:rgba(255,60,60,.15);
  --text:#f3ecec;
  --muted:#b3908f;
  --accent:#ff1f3d;
  --accent2:#8a0f1c;
  --ok:#3ddc84;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  min-height:100%;
  font-family:'Manrope',sans-serif;
  color:var(--text);
  overflow-x:hidden;
}

/* =========================
   FONDO
========================= */

.scene{
  position:fixed;
  inset:0;
  z-index:-5;
  background:#050303;
}

.scene video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  filter:
    grayscale(.4)
    contrast(1.25)
    brightness(.6)
    saturate(1.4);
}

.scene-tint{
  position:fixed;
  inset:0;
  z-index:-4;
  background:
    radial-gradient(
      circle at 78% 20%,
      rgba(255,20,45,.55),
      transparent 45%
    ),
    radial-gradient(
      circle at 15% 85%,
      rgba(140,10,25,.5),
      transparent 50%
    ),
    linear-gradient(
      160deg,
      rgba(40,4,6,.9) 0%,
      rgba(10,3,3,.95) 55%,
      rgba(3,2,2,1) 100%
    );
  mix-blend-mode:multiply;
}

.scene-tint::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(
      circle at 78% 20%,
      rgba(255,40,60,.25),
      transparent 40%
    );
  mix-blend-mode:screen;
}

.flicker{
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:rgba(255,20,40,.03);
  animation:flicker 6s infinite;
}

@keyframes flicker{
  0%,93%,100%{opacity:0}
  94%{opacity:1}
  95%{opacity:0}
  96%{opacity:.6}
  97%{opacity:0}
}

.beams{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
  opacity:.5;
  mix-blend-mode:screen;
}

.beam{
  position:absolute;
  top:-20%;
  right:5%;
  width:3px;
  height:140%;
  background:
    linear-gradient(
      to bottom,
      rgba(255,30,50,.9),
      rgba(200,10,25,0) 70%
    );
  transform-origin:top center;
  filter:blur(.5px);
  animation:sway 9s ease-in-out infinite;
}

@keyframes sway{
  0%,100%{
    transform:rotate(8deg);
    opacity:.5;
  }

  50%{
    transform:rotate(14deg);
    opacity:.85;
  }
}

.noise{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.vignette{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(
      ellipse at center,
      transparent 45%,
      rgba(0,0,0,.55) 100%
    );
}

/* =========================
   VISTAS
========================= */

.views{
  position:fixed;
  top:22px;
  right:26px;
  z-index:10;

  display:flex;
  align-items:center;
  gap:6px;

  font-size:13px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

.views svg{
  width:16px;
  height:16px;
  opacity:.8;
}

/* =========================
   CONTROLES DEL VIDEO
========================= */

.video-controls{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);

  z-index:20;

  width:min(420px,calc(100% - 30px));

  display:flex;
  align-items:center;
  gap:10px;

  padding:10px 13px;

  background:rgba(10,5,5,.72);
  border:1px solid var(--panel-border);
  border-radius:999px;

  backdrop-filter:blur(12px);

  box-shadow:
    0 10px 40px rgba(0,0,0,.45);
}

.video-controls button{
  width:32px;
  height:32px;

  border:0;
  border-radius:50%;

  background:var(--text);
  color:#080606;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  flex-shrink:0;

  transition:
    transform .15s ease,
    background .2s ease;
}

.video-controls button:hover{
  transform:scale(1.08);
}

.video-controls button svg{
  width:15px;
  height:15px;
  fill:currentColor;
}

.video-time{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--muted);
  min-width:34px;
  text-align:center;
}

.video-progress{
  flex:1;
  height:5px;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  cursor:pointer;
  position:relative;
}

.video-progress-fill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:0%;
  border-radius:999px;
  background:var(--accent);
  pointer-events:none;
}

.video-volume{
  width:70px;
  accent-color:var(--accent);
  cursor:pointer;
}

/* =========================
   CONTENIDO
========================= */

.wrap{
  position:relative;
  z-index:2;

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:40px 20px 90px;
}

.box{
  width:100%;
  max-width:380px;

  background:rgba(10,5,5,.55);

  border:1px solid rgba(255,40,60,.25);

  border-radius:10px;

  backdrop-filter:blur(14px);

  box-shadow:
    0 0 0 1px rgba(255,20,45,.06),
    0 40px 100px -30px rgba(0,0,0,.85);

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;

  padding:30px 28px 26px;

  position:relative;

  animation:boxIn .6s cubic-bezier(.2,.8,.2,1) forwards;
}

.box::before{
  content:"";

  position:absolute;
  top:0;
  left:0;
  right:0;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      var(--accent),
      transparent
    );

  opacity:.8;
}

.box::after{
  content:"";

  position:absolute;

  top:10px;
  left:10px;
  right:10px;
  bottom:10px;

  border:1px solid rgba(255,40,60,.08);

  border-radius:6px;

  pointer-events:none;
}

@keyframes boxIn{
  from{
    opacity:0;
    transform:scale(.96);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.box > *{
  opacity:0;
  animation:
    fadeUp .6s cubic-bezier(.2,.8,.2,1)
    forwards;
}

.box > *:nth-child(1){animation-delay:.15s}
.box > *:nth-child(2){animation-delay:.25s}
.box > *:nth-child(3){animation-delay:.35s}
.box > *:nth-child(4){animation-delay:.45s}

/* =========================
   AVATAR
========================= */

.avatar{
  width:96px;
  height:96px;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #1a1512,
      #0c0a09
    );

  border:2px solid rgba(255,60,70,.25);

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 0 30px rgba(255,20,45,.3),
    0 16px 30px rgba(0,0,0,.6);

  position:relative;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
  position:relative;
  z-index:1;
}

.avatar::before{
  content:"";

  position:absolute;
  inset:0;

  background:
    linear-gradient(
      105deg,
      transparent 40%,
      rgba(255,20,45,.18) 48%,
      transparent 56%
    ),
    linear-gradient(
      200deg,
      transparent 60%,
      rgba(255,20,45,.12) 68%,
      transparent 74%
    );
}

.avatar::after{
  content:"";

  position:absolute;
  inset:-6px;

  border-radius:50%;

  border:1px solid rgba(255,20,45,.4);

  animation:ring 2.6s ease-out infinite;
}

@keyframes ring{
  0%{
    transform:scale(.9);
    opacity:.7;
  }

  100%{
    transform:scale(1.25);
    opacity:0;
  }
}

/* =========================
   NOMBRE
========================= */

.username{
  font-size:30px;
  font-weight:800;

  letter-spacing:.3px;

  text-shadow:
    0 2px 20px rgba(0,0,0,.6);

  position:relative;
}

.username::before,
.username::after{
  content:attr(data-text);

  position:absolute;
  inset:0;

  opacity:0;
}

.username:hover::before{
  color:#ff1f3d;
  opacity:.7;

  animation:
    glitchTop .4s steps(2) infinite;
}

.username:hover::after{
  color:#4dd9ff;
  opacity:.5;

  animation:
    glitchBot .4s steps(2) infinite;
}

@keyframes glitchTop{
  0%{
    transform:translate(0,0);
    clip-path:inset(0 0 60% 0);
  }

  50%{
    transform:translate(-2px,-1px);
    clip-path:inset(0 0 40% 0);
  }

  100%{
    transform:translate(1px,1px);
    clip-path:inset(0 0 70% 0);
  }
}

@keyframes glitchBot{
  0%{
    transform:translate(0,0);
    clip-path:inset(60% 0 0 0);
  }

  50%{
    transform:translate(2px,1px);
    clip-path:inset(40% 0 0 0);
  }

  100%{
    transform:translate(-1px,-1px);
    clip-path:inset(75% 0 0 0);
  }
}

/* =========================
   DISCORD
========================= */

.discord-tag{
  display:inline-flex;
  align-items:center;
  gap:8px;

  background:var(--panel);

  border:1px solid var(--panel-border);

  backdrop-filter:blur(6px);

  padding:7px 14px;

  border-radius:999px;

  font-size:13px;

  font-family:'JetBrains Mono',monospace;

  cursor:pointer;

  transition:
    border-color .2s ease,
    transform .15s ease;
}

.discord-tag:hover{
  border-color:var(--accent);
  transform:translateY(-2px);
}

.discord-tag .copy-hint{
  font-size:10px;
  color:var(--muted);
  font-family:'Manrope',sans-serif;
}

.discord-tag .discord-icon{
  width:16px;
  height:16px;
  flex-shrink:0;
  color:#5865F2;
}

/* =========================
   REDES
========================= */

.socials{
  display:flex;
  gap:14px;
  margin-top:-5px;
}

.socials a{
  width:38px;
  height:38px;

  border-radius:50%;

  background:var(--panel);

  border:1px solid var(--panel-border);

  backdrop-filter:blur(6px);

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--text);

  text-decoration:none;

  transition:
    transform .15s ease,
    border-color .2s ease;
}

.socials a:hover{
  transform:translateY(-3px);
  border-color:var(--accent);
}

.socials svg{
  width:17px;
  height:17px;
}

/* =========================
   DISCORD LANYARD
========================= */

.conn{
  width:100%;
  max-width:340px;
  background:var(--panel);
  border:1px solid var(--panel-border);
  backdrop-filter:blur(10px);
  border-radius:14px;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:0;
  position:relative;
  overflow:hidden;
  transition:border-color .25s ease, transform .25s ease;
}

.conn::before{
  content:"";
  position:absolute;
  top:0; left:0; right:0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:.7;
}

.conn:hover{
  border-color:rgba(255,31,61,.35);
  transform:translateY(-2px);
}

/* Profile row */
.conn-profile-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.conn-avatar-wrap{
  position:relative;
  flex-shrink:0;
  width:46px;
  height:46px;
}

.conn-avatar{
  width:46px; height:46px;
  border-radius:50%;
  background:#151010;
  border:1px solid rgba(255,255,255,.1);
  object-fit:cover;
  display:block;
}

.conn-info{
  flex:1;
  min-width:0;
  text-align:left;
}

.conn-name-row{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}

.conn-name{
  font-weight:700;
  font-size:15px;
  line-height:1.2;
}

.conn-badges{
  display:flex;
  align-items:center;
  gap:3px;
  flex-wrap:wrap;
}

.conn-badge{
  width:16px; height:16px;
  border-radius:3px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:700;
  line-height:1;
  color:#fff;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.15);
  cursor:help;
  flex-shrink:0;
}

.conn-badge img{
  width:14px; height:14px;
  display:block;
}

.conn-status{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* Custom status */
.conn-custom-status{
  font-size:11px;
  color:#d6bebe;
  padding:0;
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.conn-custom-status:empty{
  display:none;
}
.conn-custom-status:not(:empty){
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,.06);
}

/* Activity Panels */
.activity-panel{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.05);
  animation:activitySlideIn .4s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes activitySlideIn{
  from{ opacity:0; transform:translateY(8px); }
  to{ opacity:1; transform:translateY(0); }
}

.activity-panel-header{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:10px;
}

.activity-type-icon{
  width:14px; height:14px;
  flex-shrink:0;
}

.spotify-green{ color:#1db954; }
.game-blue{ color:#5865f2; }

.activity-panel-label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
  color:var(--muted);
}

/* Spotify equalizer animation */
.spotify-eq{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:12px;
  margin-left:auto;
}

.spotify-eq span{
  display:block;
  width:3px;
  background:#1db954;
  border-radius:1px;
  animation:eqBounce 1.2s ease-in-out infinite;
}

.spotify-eq span:nth-child(1){
  height:4px;
  animation-delay:0s;
}
.spotify-eq span:nth-child(2){
  height:8px;
  animation-delay:.2s;
}
.spotify-eq span:nth-child(3){
  height:5px;
  animation-delay:.4s;
}

@keyframes eqBounce{
  0%,100%{ height:4px; }
  50%{ height:12px; }
}

/* Activity body */
.activity-panel-body{
  display:flex;
  align-items:center;
  gap:10px;
}

.activity-art{
  width:52px; height:52px;
  border-radius:6px;
  object-fit:cover;
  flex-shrink:0;
  background:#1a1010;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}

.activity-art-game{
  border-radius:8px;
}

.activity-art[src=""]{
  display:none;
}

.activity-details{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}

a.activity-title,
div.activity-title{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-decoration:none;
  transition:color .2s;
}

a.activity-title:hover{
  color:var(--accent);
  text-decoration:underline;
}

.activity-sub{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.activity-album-name{
  font-style:italic;
  opacity:.7;
}

.activity-elapsed{
  font-size:10px;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  margin-top:2px;
  opacity:.8;
}

/* Spotify progress bar */
.activity-progress{
  margin-top:10px;
}

.activity-progress-track{
  width:100%;
  height:3px;
  background:rgba(255,255,255,.08);
  border-radius:3px;
  overflow:hidden;
}

.activity-progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#1db954,#1ed760);
  border-radius:3px;
  transition:width 1s linear;
}

.activity-progress-times{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
  font-size:9px;
  font-family:'JetBrains Mono',monospace;
  color:var(--muted);
  opacity:.7;
}

/* Status dot */
.status-dot{
  position:absolute;
  bottom:0; right:0;
  width:12px; height:12px;
  border-radius:50%;
  background:#777;
  border:2px solid rgba(10,5,5,.9);
  flex-shrink:0;
  transition:.2s;
}

.status-dot.online{
  background:var(--ok);
  box-shadow:0 0 8px rgba(61,220,132,.7);
}

.status-dot.idle{
  background:#faa61a;
  box-shadow:0 0 8px rgba(250,166,26,.6);
}

.status-dot.dnd{
  background:#ed4245;
  box-shadow:0 0 8px rgba(237,66,69,.6);
}

.status-dot.offline{
  background:#747f8d;
  box-shadow:none;
}

/* =========================
   MADE BY
========================= */

.madeby{
  position:fixed;

  bottom:18px;
  right:22px;

  z-index:5;

  display:flex;
  align-items:center;
  gap:6px;

  font-size:12px;
  color:var(--muted);

  background:var(--panel);

  border:1px solid var(--panel-border);

  backdrop-filter:blur(6px);

  padding:7px 12px;

  border-radius:999px;
}

.madeby svg{
  width:13px;
  height:13px;
  color:var(--accent);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:480px){

  .box{
    max-width:340px;
    padding:28px 22px;
  }

  .username{
    font-size:24px;
  }

  .avatar{
    width:88px;
    height:88px;
    font-size:32px;
  }

  .views{
    top:15px;
    right:15px;
  }

  .madeby{
    display:none;
  }

  .video-controls{
    bottom:15px;
  }

  .video-volume{
    width:55px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation:none !important;
    transition:none !important;
  }

  .box > *{
    opacity:1 !important;
  }
}
</style>
</head>

<body>

<!-- =========================
     VIDEO DE FONDO
========================= -->

<div class="scene">

<video
  id="bgVideo"
  autoplay
  playsinline
  preload="auto">
  <source src="damage_web.mp4" type="video/mp4">
</video>

</div>

<div class="scene-tint"></div>

<div class="beams">

  <div
    class="beam"
    style="right:8%;animation-delay:0s;"
  ></div>

  <div
    class="beam"
    style="right:14%;animation-delay:-3s;opacity:.3;"
  ></div>

  <div
    class="beam"
    style="right:2%;animation-delay:-6s;opacity:.35;"
  ></div>

</div>

<div class="noise"></div>
<div class="vignette"></div>
<div class="flicker"></div>


<!-- =========================
     VISTAS
========================= -->

<div class="views">

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  >
    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>

  <span id="viewCount">128</span>

</div>


<!-- =========================
     CONTROLES SIMPLES
========================= -->

<div class="video-controls">

  <button
    id="videoPlay"
    type="button"
    title="Reproducir / Pausar"
  >

    <svg
      id="videoPlayIcon"
      viewBox="0 0 24 24"
    >
      <path d="M8 5v14l11-7z"/>
    </svg>

  </button>


  <span
    class="video-time"
    id="videoCurrent"

/* =====================================================

const bgVideo =

const videoPlay =

const videoPlayIcon =

const videoCurrent =

const videoDuration =

/* =====================================================

===================================================== */

const videoPlaylist = [
  "damage_web.mp4",
  "damage1_web.mp4",
  "damage2_web.mp4",
  "damage3_web.mp4",
  "damage4_web.mp4"
];

let videoIndex = 0;

bgVideo.loop = false;

function loadVideo(index){
  videoIndex =
    ((index % videoPlaylist.length) + videoPlaylist.length)
    % videoPlaylist.length;

  const src = videoPlaylist[videoIndex];

  bgVideo.src = src;
  bgVideo.load();
}

bgVideo.addEventListener("ended", async () => {
  loadVideo(videoIndex + 1);

  try{
    await bgVideo.play();
  }catch(error){
    console.error("No se pudo reproducir el siguiente video:", error);
  }
});

/* Si falla un archivo, salta al siguiente */
bgVideo.addEventListener("error", async () => {
  console.warn(
    "Error con video:",
    videoPlaylist[videoIndex]
  );

  loadVideo(videoIndex + 1);

  try{
    await bgVideo.play();
  }catch(error){
    /* ignore */
  }
});


/* Formato de tiempo */

function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "00:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60);

  return (
    String(minutes).padStart(2,"0")
    + ":" +
    String(secs).padStart(2,"0")
  );

}


/* =====================================================
   PLAY / PAUSA
===================================================== */

videoPlay.addEventListener("click", async () => {

  if(bgVideo.paused){

    try{

      await bgVideo.play();

    }catch(error){

      console.error(
        "No se pudo reproducir el video:",
        error
      );

    }

  }else{

    bgVideo.pause();

  }

});


/* Icono */

bgVideo.addEventListener("play", () => {

  videoPlayIcon.innerHTML =
    '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

});


bgVideo.addEventListener("pause", () => {

  videoPlayIcon.innerHTML =
    '<path d="M8 5v14l11-7z"/>';

});


/* =====================================================
   DURACIÓN
===================================================== */

bgVideo.addEventListener(
  "loadedmetadata",
  () => {

    videoDuration.textContent =
      formatTime(bgVideo.duration);

  }
);


/* =====================================================
   PROGRESO
===================================================== */

bgVideo.addEventListener(
  "timeupdate",
  () => {

    videoCurrent.textContent =
      formatTime(bgVideo.currentTime);

    if(
      Number.isFinite(bgVideo.duration)
      &&
      bgVideo.duration > 0
    ){

      const percent =
        (bgVideo.currentTime /
        bgVideo.duration) * 100;

      videoProgressFill.style.width =
        percent + "%";

    }

  }
);


/* =====================================================
   ADELANTAR / RETROCEDER
===================================================== */

videoProgress.addEventListener(
  "click",
  event => {

    if(
      !Number.isFinite(bgVideo.duration)
      ||
      bgVideo.duration <= 0
    ){

      return;

    }

    const rect =
      videoProgress.getBoundingClientRect();

    const percent =
      (event.clientX - rect.left) /
      rect.width;

    bgVideo.currentTime =
      Math.max(
        0,
        Math.min(
          bgVideo.duration,
          percent * bgVideo.duration
        )
      );

  }
);


/* =====================================================
   VOLUMEN
===================================================== */

videoVolume.addEventListener(
  "input",
  () => {

    bgVideo.volume =
      Number(videoVolume.value);

  }
);


/* =====================================================
   DISCORD LANYARD
===================================================== */

const DISCORD_ID =
  "929818234146930808";

const discordAvatar =
  document.getElementById(
    "discordAvatar"
  );

const discordName =
  document.getElementById(
    "discordName"
  );

const discordStatus =
  document.getElementById(

const statusDot =
  document.getElementById(
    "statusDot"

/*
  Lanyard WebSocket
  Permite recibir los cambios
  de Discord en tiempo real.
*/

let socket = null;


function connectLanyard(){

  socket =
    new WebSocket(
      "wss://api.lanyard.rest/socket"
    );


  socket.addEventListener(
    "open",
    () => {

      socket.send(
        JSON.stringify({
          op:2,
          d:{
            subscribe_to_id:
              DISCORD_ID
          }
        })
      );

    }
  );


  socket.addEventListener(
    "message",
    event => {

      try{

        const message =
          JSON.parse(event.data);

        if(message.op === 1){

          /*
            Heartbeat de Lanyard
          */

          setInterval(() => {

            if(
              socket &&
              socket.readyState === WebSocket.OPEN
            ){

              socket.send(
                JSON.stringify({
                  op:3
                })
              );

            }

          },message.d.heartbeat_interval);

        }


        if(
          message.op === 0
          &&
          (
            message.t === "INIT_STATE"
            ||
            message.t === "PRESENCE_UPDATE"
          )
        ){

          updateDiscord(
            message.d
          );

        }

      }catch(error){

        console.error(
          "Error procesando Lanyard:",
          error
        );

      }

    }
  );


  socket.addEventListener(
    "close",
    () => {

      setTimeout(
        connectLanyard,
        5000
      );

    }
  );


  socket.addEventListener(
    "error",
    () => {

      socket.close();

    }
  );

}


/* =====================================================
   ACTUALIZAR DISCORD
===================================================== */

const BADGE_FLAGS = [
  { bit: 1 << 0,  label: "Staff", emoji: "🛡️" },
  { bit: 1 << 1,  label: "Partner", emoji: "🤝" },
  { bit: 1 << 2,  label: "HypeSquad Events", emoji: "🎉" },
  { bit: 1 << 3,  label: "Bug Hunter", emoji: "🐛" },
  { bit: 1 << 9,  label: "Early Supporter", emoji: "⭐" },
  { bit: 1 << 14, label: "Bug Hunter 2", emoji: "🪲" },
  { bit: 1 << 17, label: "Early Verified Bot Dev", emoji: "🤖" },
  { bit: 1 << 18, label: "Moderator Programs Alumni", emoji: "📜" },
  { bit: 1 << 22, label: "Active Developer", emoji: "💻" }
];


const CLAN_BADGE_URL =
  "https://cdn.discordapp.com/clan-badges/1525131210387620062/8b5c47f099b3b1b174d2cb0217c3f5f9.png?size=16";


function renderBadges(user){
  const badgesEl = document.getElementById("discordBadges");
  if(!badgesEl) return;

  badgesEl.innerHTML = "";

  /* Clan / tag badge */
  const clan = document.createElement("span");
  clan.className = "conn-badge conn-badge-img";
  clan.title = "Clan";
  const clanImg = document.createElement("img");
  clanImg.src = CLAN_BADGE_URL;
  clanImg.alt = "Clan";
  clanImg.width = 14;
  clanImg.height = 14;
  clan.appendChild(clanImg);
  badgesEl.appendChild(clan);

  const flags = user.public_flags || 0;
  const badges = BADGE_FLAGS.filter(b => (flags & b.bit) !== 0);

  if(user.premium_type && user.premium_type > 0){
    badges.unshift({ label: "Nitro", emoji: "💎" });
  }

  badges.forEach(b => {
    const span = document.createElement("span");
    span.className = "conn-badge";
    span.title = b.label;
    span.textContent = b.emoji;
    badgesEl.appendChild(span);
  });
}


function updateDiscord(data){
  if(!data) return;

  /* Nombre + avatar + insignias */
  if(data.discord_user){
    const user = data.discord_user;
    discordName.textContent = user.global_name || user.display_name || user.username || "Tez4";

    if(user.avatar){
      const ext = user.avatar.startsWith("a_") ? "gif" : "png";
      discordAvatar.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`;
    }else{
      const idx = (BigInt(user.id) >> 22n) % 6n;
      discordAvatar.src = `https://cdn.discordapp.com/embed/avatars/${idx}.png`;
    }

    renderBadges(user);
  }

  /* Estado */
  const status = data.discord_status || "offline";
  const statusNames = { online:"En línea", idle:"Ausente", dnd:"", offline:"Desconectado" };
  discordStatus.textContent = statusNames[status] ?? "Desconectado";
  statusDot.classList.remove("online","idle","dnd","offline");
  statusDot.classList.add(status);

  /* Actividades */
  const activities = Array.isArray(data.activities) ? data.activities : [];
  const custom = activities.find(a => a.type === 4);
  const spotify = data.spotify || null;
  const gameActivity = activities.find(a => a.type === 0); /* Playing */

  /* Paneles */
  const spotifyPanel = document.getElementById("spotifyPanel");
  const gamePanel = document.getElementById("gamePanel");
  const customStatusEl = document.getElementById("discordCustomStatus");

  /* Custom status */
  if(custom && custom.state){
    customStatusEl.textContent = custom.state;
  }else{
    customStatusEl.textContent = "";
  }

  /* Spotify */
  if(spotify){
    spotifyPanel.style.display = "block";

    const spotifyArt = document.getElementById("spotifyArt");
    const spotifySong = document.getElementById("spotifySong");
    const spotifyArtist = document.getElementById("spotifyArtist");
    const spotifyAlbum = document.getElementById("spotifyAlbum");

    spotifyArt.src = spotify.album_art_url || "";
    spotifySong.textContent = spotify.song || "—";
    spotifySong.href = spotify.track_id ? `https://open.spotify.com/track/${spotify.track_id}` : "#";
    spotifyArtist.textContent = spotify.artist ? `por ${spotify.artist.replace(/;/g, ", ")}` : "—";
    spotifyAlbum.textContent = spotify.album || "";

    /* Progress bar */
    updateSpotifyProgress(spotify);

  }else{
    spotifyPanel.style.display = "none";
    if(window._spotifyInterval){
      clearInterval(window._spotifyInterval);
      window._spotifyInterval = null;
    }
  }

  /* Game / other activity */
  if(gameActivity){
    gamePanel.style.display = "block";

    const gameName = document.getElementById("gameName");
    const gameDetails = document.getElementById("gameDetails");
    const gameState = document.getElementById("gameState");
    const gameElapsed = document.getElementById("gameElapsed");
    const gameArt = document.getElementById("gameArt");
    const gameLabel = document.getElementById("gameLabel");

    gameName.textContent = gameActivity.name || "—";
    gameDetails.textContent = gameActivity.details || "";
    gameState.textContent = gameActivity.state || "";

    /* Label */
    gameLabel.textContent = "Jugando";

    /* Game icon from assets */
    if(gameActivity.assets && gameActivity.assets.large_image){
      let imgUrl = gameActivity.assets.large_image;
      if(imgUrl.startsWith("mp:external/")){
        imgUrl = `https://media.discordapp.net/${imgUrl.replace("mp:", "")}`;
      }else if(gameActivity.application_id){
        imgUrl = `https://cdn.discordapp.com/app-assets/${gameActivity.application_id}/${imgUrl}.png`;
      }
      gameArt.src = imgUrl;
      gameArt.style.display = "block";
    }else{
      gameArt.src = "";
      gameArt.style.display = "none";
    }

    /* Elapsed time */
    if(gameActivity.timestamps && gameActivity.timestamps.start){
      const startMs = gameActivity.timestamps.start;
      function updateElapsed(){
        const elapsed = Date.now() - startMs;
        const mins = Math.floor(elapsed / 60000);
        const hrs = Math.floor(mins / 60);
        if(hrs > 0){
          gameElapsed.textContent = `${hrs}h ${mins % 60}m jugando`;
        }else{
          gameElapsed.textContent = `${mins}m jugando`;
        }
      }
      updateElapsed();
      if(window._gameElapsedInterval) clearInterval(window._gameElapsedInterval);
      window._gameElapsedInterval = setInterval(updateElapsed, 30000);
    }else{
      gameElapsed.textContent = "";
      if(window._gameElapsedInterval){
        clearInterval(window._gameElapsedInterval);
        window._gameElapsedInterval = null;
      }
    }

  }else{
    gamePanel.style.display = "none";
    if(window._gameElapsedInterval){
      clearInterval(window._gameElapsedInterval);
      window._gameElapsedInterval = null;
    }
  }
}


/* Spotify progress updater */
function updateSpotifyProgress(spotify){
  const fillEl = document.getElementById("spotifyProgressFill");
  const elapsedEl = document.getElementById("spotifyTimeElapsed");
  const totalEl = document.getElementById("spotifyTimeTotal");

  if(!spotify || !spotify.timestamps) return;

  const start = spotify.timestamps.start;
  const end = spotify.timestamps.end;
  const duration = end - start;

  totalEl.textContent = formatSpotifyTime(duration);

  function tick(){
    const now = Date.now();
    const elapsed = Math.max(0, Math.min(now - start, duration));
    const pct = (elapsed / duration) * 100;
    fillEl.style.width = pct + "%";
    elapsedEl.textContent = formatSpotifyTime(elapsed);
  }

  tick();

  if(window._spotifyInterval) clearInterval(window._spotifyInterval);
  window._spotifyInterval = setInterval(tick, 1000);
}

function formatSpotifyTime(ms){
  const totalSecs = Math.floor(ms / 1000);
  const mins = Math.floor(totalSecs / 60);
  const secs = totalSecs % 60;
  return mins + ":" + String(secs).padStart(2, "0");
}

/* =====================================================
   COPIAR DISCORD
===================================================== */

const discordTag =
  document.getElementById(
    "discordTag"
  );

const discordTagText =
  document.getElementById(
    "discordTagText"
  );

const copyHint =
  document.getElementById(
    "copyHint"
  );


discordTag.addEventListener(
  "click",
  async () => {

    try{

      await navigator.clipboard.writeText(
        discordTagText.textContent
      );

      copyHint.textContent =
        "¡copiado!";

      setTimeout(() => {

        copyHint.textContent =
          "copiar";

      },1500);

    }catch(error){

      copyHint.textContent =
        "error";

      setTimeout(() => {

        copyHint.textContent =
          "copiar";

      },1500);

    }

  }
);

</script>
